<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EG TraceTool — Equipment 2349</title>
<style>
  :root{
    --accent:#BB5B2C;
    --accent-dark:#9A4A22;
    --accent-light:#F4E7DE;
    --ink-900:#14161B;
    --ink-700:#45505C;
    --ink-500:#6B7280;
    --ink-400:#9AA1A9;
    --border:#E4E1DD;
    --bg-page:#FFFFFF;
    --hover-bg:#F5F4F2;
    --bg-card:#FFFFFF;
    --radius:10px;
    --radius-sm:6px;
    --shadow-card:0 1px 2px rgba(31,36,48,.04), 0 1px 1px rgba(31,36,48,.03);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{font-family:'Segoe UI', Roboto, Arial, sans-serif; background:var(--bg-page); color:var(--ink-900); font-size:13.5px; display:flex; flex-direction:column;}
  a{color:inherit;}
  svg{display:block;}
  button{font-family:inherit;}

  .top-bar{
    flex:none; display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-bottom:1px solid var(--border); padding:0 20px; height:52px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:14.5px; cursor:pointer;}
  .logo-mark{
    width:22px;height:22px;border-radius:6px;flex:none;
    background:url('assets/logo.png') center/cover no-repeat, linear-gradient(135deg, var(--accent) 50%, var(--accent-dark) 50%);
  }
  .top-bar-actions{display:flex; align-items:center; gap:10px;}
  .btn{border-radius:var(--radius-sm); font-size:12.5px; font-weight:600; cursor:pointer; height:34px; padding:0 14px; display:flex; align-items:center; gap:6px;}
  .btn-ghost{background:#fff; border:1px solid var(--border); color:var(--ink-700);}
  .btn-ghost:hover{border-color:var(--ink-400);}
  .btn-primary{background:var(--accent); border:none; color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .toolbar-divider{width:1px; height:22px; background:var(--border); margin:0 2px;}
  .close-btn{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:#fff;color:var(--ink-500);
    display:flex;align-items:center;justify-content:center;cursor:pointer; flex:none;
  }
  .close-btn:hover{border-color:var(--ink-400); color:var(--ink-700);}

  .page-header{
    flex:none; display:flex; align-items:center; gap:12px; padding:14px 20px;
    background:#fff; border-bottom:1px solid var(--border);
  }
  .page-header .icon-badge{
    width:34px;height:34px;border-radius:8px;background:var(--accent-light); color:var(--accent-dark);
    display:flex;align-items:center;justify-content:center; flex:none;
  }
  .page-header h1{font-size:16px; margin:0; font-weight:700;}
  .page-header .sub{font-size:12.5px; color:var(--ink-500); font-weight:400;}

  .layout{display:flex; flex:1; min-height:0;}

  .tab-sidebar{
    width:190px; flex:none; background:#fff; border-right:1px solid var(--border);
    padding:14px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;
  }
  .tab-item{padding:9px 12px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; color:var(--ink-700); cursor:pointer;}
  .tab-item:hover{background:var(--hover-bg);}
  .tab-item.active{background:var(--accent-light); color:var(--accent-dark);}

  .form-scroll{flex:1; min-width:0; overflow-y:auto;}
  .form-wrap{display:flex; gap:32px; padding:28px 32px; max-width:1200px;}
  .form-col{flex:1; min-width:0; max-width:460px;}
  .field{margin-bottom:16px;}
  .field label{display:flex; align-items:center; gap:4px; font-size:12.5px; font-weight:600; color:var(--ink-700); margin-bottom:6px;}
  .req{color:var(--accent-dark); font-weight:700;}
  .field input[type=text], .field input[type=number], .field select, .field .input-btn-group input{
    width:100%; border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 12px; font-size:13px; color:var(--ink-900); background:#fff; font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light);}
  .field select{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B7280' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; background-size:14px;}
  .input-btn-group{display:flex; gap:8px;}
  .input-btn-group input{flex:1;}
  .input-btn-group button{flex:none; border:1px solid var(--border); background:#fff; border-radius:var(--radius-sm); padding:0 14px; font-size:12px; font-weight:600; color:var(--ink-700); cursor:pointer;}
  .input-btn-group button:hover{border-color:var(--ink-400);}
  .date-input{position:relative;}
  .date-input svg{position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--ink-400); pointer-events:none;}

  .form-right{flex:1; min-width:0; max-width:420px; display:flex; flex-direction:column; gap:22px;}
  .panel{border:1px solid var(--border); border-radius:var(--radius); background:#fff; overflow:hidden;}
  .panel-head{padding:10px 14px; border-bottom:1px solid var(--border); font-size:12.5px; font-weight:700; color:var(--ink-700); display:flex; justify-content:space-between; align-items:center;}
  .picture-box{
    height:220px; display:flex; align-items:center; justify-content:center; color:var(--ink-400);
    background:repeating-linear-gradient(45deg, #FAF9F7 0 10px, #F3F1EE 10px 20px);
  }
  .panel-foot{padding:10px 14px; display:flex; justify-content:flex-end;}
  .rotate-btn{
    display:flex; align-items:center; gap:6px; border:1px solid var(--border); background:#fff;
    border-radius:var(--radius-sm); padding:6px 10px; font-size:11.5px; font-weight:600; color:var(--ink-700); cursor:pointer;
  }
  .add-btn{border:1px solid var(--border); background:#fff; border-radius:var(--radius-sm); padding:6px 12px; font-size:12px; font-weight:600; color:var(--ink-700); cursor:pointer;}
  .details-box{width:100%; min-height:180px; border:none; padding:14px; font-size:13px; font-family:inherit; color:var(--ink-700); resize:vertical;}
  .details-box:focus{outline:none;}
</style>
</head>

            </div>
            <div class="panel-foot" style="justify-content:space-between; align-items:center;">
              <button class="rotate-btn">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M5.5 9a7 7 0 0112-3.5L20 8M4 16l2.5 2.5A7 7 0 0018.5 15"/></svg>
                Rotate
