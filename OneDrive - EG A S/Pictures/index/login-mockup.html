<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EG TraceTool — Login (Redesign Mockup)</title>
<style>
  :root{
    --accent:#BB5B2C;
    --accent-dark:#9A4A22;
    --accent-light:#F4E7DE;
    --ink-900:#14161B;
    --ink-700:#45505C;
    --ink-500:#6B7280;
    --ink-400:#9AA1A9;
    --border:#E4E1DD;
    --bg-page:#FFFFFF;
    --bg-card:#FFFFFF;
    --radius:10px;
    --radius-sm:6px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--bg-page);
    color:var(--ink-900);
  }
  .login-shell{
    display:flex;
    height:100vh;
    min-height:640px;
  }

  /* ---------- Left: photo panel ---------- */
  .photo-panel{
    position:relative;
    flex:1 1 50%;
    overflow:hidden;
    /* gradient shows through only until assets/hero.jpg exists */
    background: linear-gradient(160deg, #241f1b 0%, #4a3324 45%, #7a4a26 100%);
  }
  .hero-img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .photo-note{
    display:none;
    position:absolute; top:24px; left:24px;
    font-size:11px; letter-spacing:.04em;
    color:rgba(255,255,255,0.6);
    border:1px dashed rgba(255,255,255,0.35);
    padding:4px 10px; border-radius:20px;
    z-index:2;
  }
  .photo-panel.no-photo .photo-note{display:inline-block;}

  /* ---------- Right: form panel ---------- */
  .form-panel{
    flex:1 1 50%;
    background:var(--bg-card);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .top-bar{
    display:flex; justify-content:flex-end; align-items:center;
    gap:14px; padding:20px 32px;
  }
  .icon-btn{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-500); border:1px solid var(--border); background:#fff;
  }
  .support-chip{
    display:flex;align-items:center;gap:8px;
    border:1px solid var(--border); border-radius:20px;
    padding:5px 12px 5px 5px; font-size:13px; color:var(--ink-700);
  }
  .support-chip img,.support-chip .avatar{
    width:24px;height:24px;border-radius:50%;
    background:var(--accent-light); color:var(--accent-dark);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  }

  .form-center{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{width:100%; max-width:400px;}
  .brand-row{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
  .logo-mark{
    width:34px;height:34px;border-radius:8px;flex:none;
    background:url('assets/logo.png') center/cover no-repeat, linear-gradient(135deg, var(--accent) 50%, var(--accent-dark) 50%);
  }
  .brand-text{font-size:19px;font-weight:700;color:var(--ink-900);}

  .tabs{display:flex; gap:28px; border-bottom:1px solid var(--border); margin-bottom:22px;}
  .tab{
    background:none;border:none;cursor:pointer;
    font-size:14px; font-family:inherit; color:var(--ink-500);
    padding:0 0 12px; position:relative; font-weight:600;
  }
  .tab.active{color:var(--ink-900);}
  .tab.active::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);
  }

  .field-hint{font-size:12px;color:var(--ink-500);margin:0 0 16px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-700);margin-bottom:6px;letter-spacing:.01em;}
  .input-wrap{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:11px 14px; background:#fff;
  }
  .input-wrap:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light);}
  .input-wrap svg{flex:none; color:var(--ink-400);}
  .input-wrap input{
    border:none;outline:none;font-size:14px;color:var(--ink-900);width:100%;
    font-family:inherit; background:transparent;
  }
  .input-wrap input::placeholder{color:var(--ink-400);}

  .row-between{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px;font-size:13px;}
  .remember{display:flex;align-items:center;gap:8px;color:var(--ink-700);}
  .remember input{accent-color:var(--accent); width:15px;height:15px;}
  .forgot{color:var(--accent-dark); text-decoration:none; font-weight:600;}
  .forgot:hover{text-decoration:underline;}

  .btn{
    width:100%; border:none; border-radius:var(--radius-sm);
    padding:13px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer;
    letter-spacing:.02em;
  }
  .btn-primary{background:var(--accent); color:#fff; margin-bottom:14px;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-outline{
    background:#fff; color:var(--ink-900); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-outline:hover{border-color:var(--ink-400);}

  .bottom-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 32px; font-size:12px; color:var(--ink-500);
  }
  .flags{display:flex;gap:8px;}
  .flag{width:22px;height:15px;border-radius:2px;border:1px solid var(--border);}
</style>
</head>
<body>
  <div class="login-shell">

    <div class="photo-panel" id="photoPanel">
      <img class="hero-img" src="assets/hero.jpg" alt=""
           onerror="this.style.display='none'; document.getElementById('photoPanel').classList.add('no-photo');">
      <span class="photo-note">drop your craftsman/workshop photo at assets/hero.jpg</span>
    </div>

    <div class="form-panel">
      <div class="top-bar">
        <div class="icon-btn" title="Language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
        </div>
        <div class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        </div>
        <div class="support-chip">
          <div class="avatar">DS</div>
          Dev Support
        </div>
      </div>

      <div class="form-center">
        <div class="login-card">
          <div class="brand-row">
            <div class="logo-mark"></div>
            <div class="brand-text">EG TraceTool</div>
          </div>

          <div class="tabs">
            <button class="tab active" type="button">User Login</button>
            <button class="tab" type="button">Company Login</button>
          </div>

          <p class="field-hint">Choose login method</p>

          <div class="field">
            <label>User ID or Employee Number</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-3.6 4.8-5.5 8-5.5s6.4 1.9 8 5.5"/></svg>
              <input type="text" placeholder="User ID or Employee number">
            </div>
          </div>

          <div class="field">
            <label>Password</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
              <input type="password" placeholder="User Password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
          </div>

          <div class="field">
            <label>Company ID</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h2M8 12h2M8 16h2M14 8h2M14 12h2M14 16h2"/></svg>
              <input type="text" placeholder="Company ID">
            </div>
          </div>

          <div class="row-between">
            <label class="remember"><input type="checkbox" checked> Remember Login</label>
            <a class="forgot" href="#">Forgot Password</a>
          </div>

          <button class="btn btn-primary" onclick="window.location.href='dashboard-mockup.html'">LOGIN</button>
          <button class="btn btn-outline" onclick="window.location.href='dashboard-mockup.html'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            TraceTool SSO Login
          </button>
        </div>
      </div>

      <div class="bottom-bar">
        <span>EG TraceTool · v1.1.09922.S</span>
        <div class="flags">
          <div class="flag" style="background:#c8102e"></div>
          <div class="flag" style="background:#c60c30"></div>
          <div class="flag" style="background:#00247d"></div>
        </div>
      </div>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      console.log(`Switched to: ${this.textContent}`);
    });
  });

  // Login button
  document.querySelectorAll('.btn-primary').forEach(btn => {
    if(btn.textContent.includes('LOGIN')) {
      btn.addEventListener('click', function(e){
        e.preventDefault();
        const userid = document.querySelector('input[placeholder="User ID or Employee number"]')?.value || '(empty)';
        const company = document.querySelector('input[placeholder="Company ID"]')?.value || '(empty)';
        });
    }
  });

  // SSO button
  document.querySelectorAll('.btn-outline').forEach(btn => {
    btn.addEventListener('click', function(e){
      e.preventDefault();
      });
  });

  // Forgot password link
  document.querySelector('.forgot')?.addEventListener('click', function(e){
    e.preventDefault();
    });

  // Icon buttons (Language, Settings, Support)
  document.querySelectorAll('.icon-btn').forEach(btn => {
    btn.addEventListener('click', function(){
      const title = this.getAttribute('title') || 'Button';
      });
  });

  // Input fields
  document.querySelectorAll('input[type="text"], input[type="password"]').forEach(input => {
    input.addEventListener('focus', function(){
      this.parentElement.style.borderColor = 'var(--accent)';
      this.parentElement.style.boxShadow = '0 0 0 3px var(--accent-light)';
    });
    input.addEventListener('blur', function(){
      this.parentElement.style.borderColor = 'var(--border)';
      this.parentElement.style.boxShadow = 'none';
    });
  });

  // Remember checkbox
  document.querySelector('input[type="checkbox"]')?.addEventListener('change', function(){
    console.log(`Remember Login: ${this.checked}`);
  });

  // Password visibility toggle (if eye icon exists)
  document.querySelectorAll('.input-wrap svg').forEach((svg, idx) => {
    if(idx === 2) { // Eye icon is the 3rd SVG in inputs
      svg.parentElement.style.cursor = 'pointer';
      svg.addEventListener('click', function(){
        const input = this.parentElement.querySelector('input');
        if(input) {
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          console.log(`Password visibility: ${isPassword ? 'shown' : 'hidden'}`);
        }
      });
    }
  });
});
</script>
</body>
</html>
