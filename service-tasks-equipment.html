<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EG TraceTool — Service Tasks Equipment</title>
<style>
  :root{
    --accent:#BB5B2C;
    --accent-dark:#9A4A22;
    --accent-light:#F4E7DE;
    --ink-900:#14161B;
    --ink-700:#45505C;
    --ink-500:#6B7280;
    --ink-400:#9AA1A9;
    --border:#E4E1DD;
    --bg-page:#FFFFFF;
    --hover-bg:#F5F4F2;
    --bg-subtle:#F9F8F7;
    --warn:#B7791F;
    --warn-bg:#FBF1DD;
    --success:#2E8B57;
    --success-bg:#E7F5EC;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{font-family:'Segoe UI', Roboto, Arial, sans-serif; background:var(--bg-page); color:var(--ink-900); font-size:13.5px; display:flex; flex-direction:column;}
  svg{display:block;}
  button{font-family:inherit;}

  .top-nav{
    display:flex; align-items:center; gap:28px; flex:none;
    background:#fff; border-bottom:1px solid var(--border);
    padding:0 24px; height:56px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; cursor:pointer;}
  .logo-mark{
    width:24px;height:24px;border-radius:6px;flex:none;
    background:url('assets/logo.png') center/cover no-repeat, linear-gradient(135deg, var(--accent) 50%, var(--accent-dark) 50%);
  }
  .nav-tabs{display:flex; gap:4px; height:100%;}
  .nav-tab{
    display:flex;align-items:center;height:100%;padding:0 14px;
    font-size:13.5px; font-weight:600; color:var(--ink-500); border-bottom:2px solid transparent;
    cursor:pointer;
  }
  .nav-tab.active{color:var(--ink-900); border-bottom-color:var(--accent);}
  .top-nav-right{margin-left:auto; display:flex; align-items:center; gap:18px;}
  .user-chip{display:flex; align-items:center; gap:8px; padding-left:14px; border-left:1px solid var(--border); cursor:pointer;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-light); color:var(--accent-dark);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
  .user-chip .name{font-size:13px;font-weight:600;}

  .layout{display:flex; align-items:stretch; flex:1; min-height:0;}

  .icon-sidebar{
    width:116px; flex:none; background:#fff; border-right:1px solid var(--border);
    padding:18px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; overflow-y:auto;
  }
  .icon-nav-item{
    display:flex; flex-direction:column; align-items:center; gap:5px; padding:6px 2px;
    border-radius:6px; cursor:pointer; text-align:center; width:100%;
  }
  .icon-nav-item .icon-tile{
    width:36px; height:36px; border-radius:10px; flex:none;
    display:flex; align-items:center; justify-content:center; color:var(--ink-500);
    transition:background .12s ease, color .12s ease;
  }
  .icon-nav-item .label{font-size:10.5px; font-weight:600; color:var(--ink-700); line-height:1.2;}
  .icon-nav-item:hover .icon-tile{background:var(--hover-bg);}
  .icon-nav-item.active .icon-tile{background:var(--accent-light); color:var(--accent-dark);}
  .icon-nav-item.active .label{color:var(--accent-dark);}

  .content-area{flex:1; min-width:0; display:flex; flex-direction:column; min-height:0;}
  .content-header{position:relative; flex:none; padding:20px 24px 14px; border-bottom:1px solid var(--border); background:#fff;}
  .content-header h1{font-size:19px; margin:0 0 14px;}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .search-box{
    display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border);
    border-radius:6px; padding:8px 12px; flex:1; min-width:220px; max-width:420px;
  }
  .search-box input{border:none;outline:none;font-size:13px;width:100%;font-family:inherit;color:var(--ink-900);}
  .tbtn{
    display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border);
    border-radius:6px; padding:8px 12px; font-size:12.5px; font-weight:600; color:var(--ink-700); cursor:pointer;
  }
  .tbtn:hover{border-color:var(--ink-400);}

  .tabs-container{
    display:flex;
    gap:0;
    padding:0 24px;
    background:#fff;
    border-bottom:1px solid var(--border);
    font-size:11px;
    align-items:center;
  }

  .tab-group{
    display:flex;
    gap:0;
    align-items:center;
  }

  .tab-group.planned{
    border-right:1px solid var(--border);
    padding-right:24px;
    margin-right:24px;
  }

  .tab-section-label{
    padding:12px 16px;
    font-weight:700;
    color:var(--ink-500);
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:0.03em;
    margin-right:8px;
    white-space:nowrap;
  }

  .tab{
    padding:12px 14px;
    border:none;
    background:transparent;
    color:var(--ink-500);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:all 0.2s;
    white-space:nowrap;
  }

  .tab:hover{
    color:var(--ink-700);
  }

  .tab.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }

  .table-scroll{flex:1; overflow:auto; background:#fff;}
  table{border-collapse:collapse; width:max-content; min-width:100%;}

  thead th{
    position:sticky; top:0; z-index:2;
    text-align:left; font-size:10px; letter-spacing:.03em; text-transform:uppercase;
    color:var(--ink-500); font-weight:700; padding:9px 10px; background:#FAF9F7;
    border-bottom:1px solid var(--border); white-space:nowrap;
    border-right:1px solid var(--border);
  }

  tbody td{
    padding:8px 10px; font-size:12px; color:var(--ink-700); border-bottom:1px solid #F0EEEB;
    white-space:nowrap; border-right:1px solid #F0EEEB;
  }

  tbody tr:hover td{background:#FBFAF9;}

  .status-badge{
    display:inline-block;
    padding:2px 6px;
    border-radius:3px;
    font-size:9px;
    font-weight:700;
    text-transform:uppercase;
  }

  .status-pending{
    background:var(--warn-bg);
    color:var(--warn);
  }

  .status-completed{
    background:var(--success-bg);
    color:var(--success);
  }

  .status-bar{
    flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:9px 24px; border-top:1px solid var(--border); background:#fff;
    font-size:12px; color:var(--ink-500);
  }
  .status-bar b{color:var(--ink-900);}
</style>
</head>

  function switchTab(tab, element) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    renderTable();
  }

  function filterTasks() {
    renderTable();
  }

  function renderTable() {
    const tableScrollEl = document.getElementById('tasksTableScroll');
    const statusBarEl = document.getElementById('statusBar');

    let filtered = allTasks;

    // Filter by tab
    if (currentTab.startsWith('planned')) {
      filtered = filtered.filter(t => t.taskStatus === 'pending');
    }

    // Filter by search
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    if (searchTerm) {
      filtered = filtered.filter(t =>
        t.equipmentNo.toLowerCase().includes(searchTerm) ||
        t.group.toLowerCase().includes(searchTerm) ||
        t.type.toLowerCase().includes(searchTerm)
      );
    }

    if (filtered.length === 0) {
      tableScrollEl.innerHTML = '<div style="padding:40px; text-align:center; color:var(--ink-400);">No service tasks found</div>';
      statusBarEl.innerHTML = '<span>No results found</span>';
      return;
    }

    tableScrollEl.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Equipment no.</th>
            <th>Equipment group</th>
            <th>Manufacturer</th>
            <th>Description</th>
            <th>Department</th>
            <th>Status</th>
            <th>Type</th>
            <th>Interval</th>
            <th>Latest service</th>
            <th>Next serviceable</th>
            <th>Task Status</th>
            <th>Responsible</th>
            <th>Barcode</th>
            <th>Warehouse</th>
            <th>Placement</th>
            <th>State</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(task => `
            <tr>
              <td><strong>${task.equipmentNo}</strong></td>
              <td>${task.group}</td>
              <td>${task.manufacturer}</td>
              <td>${task.description}</td>
              <td>${task.department}</td>
              <td>${task.status}</td>
              <td>${task.type}</td>
              <td>${task.interval}</td>
              <td>${task.latestService}</td>
              <td>${task.nextService}</td>
              <td><span class="status-badge status-${task.taskStatus}">${task.taskStatus}</span></td>
              <td>${task.responsible}</td>
              <td>${task.barcode}</td>
              <td>${task.warehouse}</td>
              <td>${task.placement}</td>
              <td>${task.state}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;

    statusBarEl.innerHTML = `<span><b>${filtered.length} results</b> were found</span>`;
  }

  document.addEventListener('DOMContentLoaded', () => {
    allTasks = [...serviceTasks];
    renderTable();
  });
